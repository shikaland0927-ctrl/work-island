<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title description">
  <title id="title">Work Island</title>
  <desc id="description">A pale orbital mark over a teal and blue rounded square.</desc>
  <defs>
